# Local PostgreSQL that mirrors the CI service container.
# Usage: docker compose up -d
services:
  db:
    image: postgres:16
    container_name: omnimarket-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omnimarket
    ports:
      - "5432:5432"
    volumes:
      - omnimarket-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  omnimarket-data:
